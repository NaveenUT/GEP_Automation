# Fast checks on every push and pull request: the project compiles and Playwright can load every test.
# No browser and no site access needed, so it runs in about a minute and catches broken merges.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run list
      - name: Locator report is up to date
        run: |
          npm run locators
          git diff --exit-code LOCATORS_TODO.md || (echo "Run 'npm run locators' and commit LOCATORS_TODO.md" && exit 1)
